name: Build Nexora iOS (IPA & Runner.app)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA & Runner.app
    runs-on: macos-14 # Apple Silicon M1/M2 macOS Runner with Xcode

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Select Xcode Version
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 3. Set up Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Display tool versions
      - name: Show versions
        run: |
          flutter --version
          dart --version
          xcodebuild -version

      # 5. Install Flutter dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # 6. Disable Code Signing for CI build
      - name: Configure CI Code Signing Override
        run: |
          cat << 'EOF' >> ios/Flutter/Release.xcconfig
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=
          EXPANDED_CODE_SIGN_IDENTITY=
          EOF
          cat << 'EOF' >> ios/Flutter/Debug.xcconfig
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=
          EXPANDED_CODE_SIGN_IDENTITY=
          EOF
          echo "Code signing overrides written to xcconfig."

      # 7. Build iOS App (No-Codesign Release)
      - name: Build iOS Application
        run: |
          flutter build ios --release --no-codesign

      # 8. Package into an Installable IPA (Payload packaging for Sideloadly / AltStore)
      - name: Package IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r nexora-release.ipa Payload
          cd ../../..
          echo "Packaged IPA successfully:"
          ls -lh build/ios/iphoneos/nexora-release.ipa

      # 9. Zip Runner.app for direct Xcode / Local signing
      - name: Zip Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r Runner.app.zip Runner.app
          cd ../../..

      # 10. Upload IPA Artifact
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: nexora-release-ipa
          path: build/ios/iphoneos/nexora-release.ipa
          if-no-files-found: error

      # 11. Upload Runner.app.zip Artifact
      - name: Upload iOS Runner.app
        uses: actions/upload-artifact@v4
        with:
          name: nexora-runner-app-zip
          path: build/ios/iphoneos/Runner.app.zip
          if-no-files-found: error
