name: Build Nexora APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # 3. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # 4. Show versions
      - name: Show versions
        run: |
          flutter --version
          dart --version
          java -version


      # 5. Backup Firebase configuration
      - name: Backup Google Services
        shell: bash
        run: |
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/google-services.json
            echo "Google Services file backed up."
          else
            echo "No google-services.json found."
          fi


      # 6. Remove old Android project
      #
      # This is required because the existing Android project
      # uses the deleted Android v1 embedding.
      #
      - name: Remove old Android platform
        shell: bash
        run: |
          rm -rf android
          echo "Old Android platform removed."


      # 7. Generate a fresh modern Android project
      - name: Generate modern Android platform
        run: |
          flutter create \
            --platforms=android \
            --org com.bvccollege \
            --project-name nexora \
            .


      # 8. Restore Firebase configuration
      - name: Restore Google Services
        shell: bash
        run: |
          if [ -f /tmp/google-services.json ]; then
            mkdir -p android/app
            cp /tmp/google-services.json android/app/google-services.json
            echo "Google Services file restored."
          else
            echo "No Google Services file found."
          fi


      # 9. Get Flutter packages
      - name: Flutter Pub Get
        run: flutter pub get


      # 10. Check Flutter project
      - name: Flutter Analyze
        run: flutter analyze


      # 11. Build release APK
      - name: Build Release APK
        run: flutter build apk --release


      # 12. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          echo "Generated APK:"
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk


      # 13. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error