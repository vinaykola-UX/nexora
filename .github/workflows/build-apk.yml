name: Build Nexora APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Show versions
      - name: Show versions
        run: |
          flutter --version
          dart --version
          java -version

      # 5. Backup Firebase configuration and Android Manifest
      - name: Backup Config and Manifest
        shell: bash
        run: |
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/google-services.json
            echo "Google Services file backed up."
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
            echo "AndroidManifest.xml backed up."
          fi

      # 6. Remove old Android project
      - name: Remove old Android platform
        shell: bash
        run: |
          rm -rf android
          echo "Old Android platform removed."

      # 7. Generate a fresh modern Android project
      - name: Generate modern Android platform
        run: |
          flutter create \
            --platforms=android \
            --org com.bvcollege \
            --project-name nexora \
            .

      # 8. Restore Firebase configuration and Android Manifest
      - name: Restore Config and Manifest
        shell: bash
        run: |
          if [ -f /tmp/google-services.json ]; then
            mkdir -p android/app
            cp /tmp/google-services.json android/app/google-services.json
            echo "Google Services file restored."
          fi
          if [ -f /tmp/AndroidManifest.xml ]; then
            mkdir -p android/app/src/main
            cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            echo "AndroidManifest.xml restored."
          fi

      # 9. Decode signing keystore
      #
      # IMPORTANT: this must be written into android/app/, not android/,
      # because Gradle Kotlin DSL resolves the storeFile path in
      # key.properties relative to the app module directory (android/app/),
      # not the project root (android/).
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/nexora-release.jks

      # 10. Write key.properties
      - name: Write key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=nexora-release.jks
          EOF

      # 11. Wire up release signing config
      - name: Wire up release signing config
        run: |
          cat <<'PYEOF' > /tmp/patch_gradle.py
          import re, pathlib

          kts = pathlib.Path("android/app/build.gradle.kts")
          groovy = pathlib.Path("android/app/build.gradle")

          if kts.exists():
              path = kts
              content = path.read_text()

              imports = "import java.io.FileInputStream\nimport java.util.Properties\n\n"
              content = imports + content

              loader = (
                  "val keystoreProperties = Properties()\n"
                  "val keystorePropertiesFile = rootProject.file(\"key.properties\")\n"
                  "if (keystorePropertiesFile.exists()) {\n"
                  "    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n"
                  "}\n\n"
              )
              signing_block = (
                  "    signingConfigs {\n"
                  "        create(\"release\") {\n"
                  "            keyAlias = keystoreProperties.getProperty(\"keyAlias\")\n"
                  "            keyPassword = keystoreProperties.getProperty(\"keyPassword\")\n"
                  "            storeFile = keystoreProperties.getProperty(\"storeFile\")?.let { file(it) }\n"
                  "            storePassword = keystoreProperties.getProperty(\"storePassword\")\n"
                  "        }\n"
                  "    }\n"
              )
              content = content.replace("android {", loader + "android {\n" + signing_block, 1)
              content = re.sub(
                  r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                  'signingConfig = signingConfigs.getByName("release")',
                  content,
              )
              if "isCoreLibraryDesugaringEnabled" not in content:
                  content = content.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              if "coreLibraryDesugaring" not in content:
                  content += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              path.write_text(content)
              print("Patched build.gradle.kts with signing and desugaring")
          elif groovy.exists():
              path = groovy
              content = path.read_text()

              loader = (
                  "def keystoreProperties = new Properties()\n"
                  "def keystorePropertiesFile = rootProject.file('key.properties')\n"
                  "if (keystorePropertiesFile.exists()) {\n"
                  "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
                  "}\n\n"
              )
              signing_block = (
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            keyAlias keystoreProperties['keyAlias']\n"
                  "            keyPassword keystoreProperties['keyPassword']\n"
                  "            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n"
                  "            storePassword keystoreProperties['storePassword']\n"
                  "        }\n"
                  "    }\n"
              )
              content = content.replace("android {", loader + "android {\n" + signing_block, 1)
              content = re.sub(
                  r'signingConfig\s+signingConfigs\.debug',
                  'signingConfig signingConfigs.release',
                  content,
              )
              if "coreLibraryDesugaringEnabled" not in content:
                  content = content.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              if "coreLibraryDesugaring" not in content:
                  content += '\n\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
              path.write_text(content)
              print("Patched build.gradle with signing and desugaring")
          else:
              raise SystemExit("No android/app/build.gradle(.kts) found after flutter create")
          PYEOF
          python3 /tmp/patch_gradle.py

      # 12. Show patched build file (debugging aid)
      - name: Show patched build file
        run: cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle

      # 13. Get Flutter packages
      - name: Flutter Pub Get
        run: flutter pub get

      # 13b. Generate Nexora App Launcher Icons
      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      # 14. Build release APK
      - name: Build Release APK
        run: flutter build apk --release

      # 15. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          echo "Generated APK:"
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      # 16. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
