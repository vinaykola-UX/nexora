name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove old Android embedding
        shell: bash
        run: |
          echo "Removing old Android platform files..."
          
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi
          
          rm -rf android

      - name: Generate modern Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.bvccollege \
            .

      - name: Restore Firebase configuration
        shell: bash
        run: |
          if [ -f /tmp/google-services.json ]; then
            cp /tmp/google-services.json android/app/google-services.json
            echo "google-services.json restored."
          else
            echo "No google-services.json found. Continuing."
          fi

      - name: Verify no Android v1 embedding remains
        shell: bash
        run: |
          if grep -R "io.flutter.app.FlutterActivity\|io.flutter.app.FlutterApplication\|GeneratedPluginRegistrant.registerWith" android --include="*.java" --include="*.kt" --include="*.xml"; then
            echo "ERROR: Android v1 embedding reference still exists."
            exit 1
          fi

          echo "No Android v1 embedding references found."

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk