name: Build Nexora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Backup Firebase configuration
        shell: bash
        run: |
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/google-services.json
            echo "Firebase configuration backed up."
          else
            echo "No google-services.json found."
          fi

      - name: Remove old Android project
        run: rm -rf android

      - name: Generate modern Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.bvccollege \
            .

      - name: Restore Firebase configuration
        shell: bash
        run: |
          if [ -f /tmp/google-services.json ]; then
            mkdir -p android/app
            cp /tmp/google-services.json android/app/google-services.json
            echo "Firebase configuration restored."
          fi

      - name: Check Android project
        run: |
          echo "Checking Android project..."
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          echo "Android project structure OK."

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error