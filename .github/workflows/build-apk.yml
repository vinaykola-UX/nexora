name: Build Nexora APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout project
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Install Java 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # --------------------------------------------------
      # 3. Install Flutter
      # --------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # --------------------------------------------------
      # 4. Show versions
      # --------------------------------------------------
      - name: Show Flutter and Dart versions
        run: |
          flutter --version
          dart --version
          java -version


      # --------------------------------------------------
      # 5. Remove old Android platform
      #
      # IMPORTANT:
      # Your project was using the deleted Android v1
      # embedding. We create a fresh modern Android host.
      # --------------------------------------------------
      - name: Backup Google Services file
        shell: bash
        run: |
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/google-services.json
            echo "google-services.json backed up"
          else
            echo "No google-services.json found"
          fi


      - name: Remove old Android platform
        shell: bash
        run: |
          rm -rf android
          echo "Old Android folder removed"


      # --------------------------------------------------
      # 6. Generate fresh modern Flutter Android project
      # --------------------------------------------------
      - name: Generate modern Android platform
        run: |
          flutter create \
            --platforms=android \
            --org=com.bvccollege \
            --project-name=nexora \
            .


      # --------------------------------------------------
      # 7. Restore Google Services file if it existed
      # --------------------------------------------------
      - name: Restore Google Services file
        shell: bash
        run: |
          if [ -f /tmp/google-services.json ]; then
            mkdir -p android/app
            cp /tmp/google-services.json android/app/google-services.json
            echo "google-services.json restored"
          else
            echo "No Google Services file to restore"
          fi


      # --------------------------------------------------
      # 8. Get Flutter dependencies
      # --------------------------------------------------
      - name: Get Flutter dependencies
        run: flutter pub get


      # --------------------------------------------------
      # 9. Clean Flutter build
      # --------------------------------------------------
      - name: Flutter clean
        run: flutter clean


      # --------------------------------------------------
      # 10. Get dependencies again after clean
      # --------------------------------------------------
      - name: Get dependencies again
        run: flutter pub get


      # --------------------------------------------------
      # 11. Build APK
      # --------------------------------------------------
      - name: Build release APK
        run: flutter build apk --release


      # --------------------------------------------------
      # 12. Show generated APK
      # --------------------------------------------------
      - name: Verify APK exists
        shell: bash
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk


      # --------------------------------------------------
      # 13. Upload APK to GitHub Actions
      # --------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error